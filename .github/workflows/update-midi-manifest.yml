name: Update MIDI Manifest

on:
  push:
    branches:
      - main
    paths:
      - "MIDI/**/*.mid"
      - "MIDI/*.mid"
      - "MIDI/**/*.mscz"
      - "MIDI/*.mscz"
      - "MIDI/**/*.mscx"
      - "MIDI/*.mscx"
      - "scripts/generate_midi_manifest.py"
      - ".github/workflows/update-midi-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate MIDI manifest
        run: python scripts/generate_midi_manifest.py

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MIDI/manifest.json
          if git diff --cached --quiet; then
            echo "No manifest updates to commit."
            exit 0
          fi
          git commit -m "chore: regenerate MIDI manifest"
          git push
